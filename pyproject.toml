[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reel-mcp"
version = "0.1.0"
description = "Video understanding for AI agents: an MCP server that serves a film's frames and recorded sound on one clock."
readme = "README.md"
authors = [{ name = "Dradradre" }]
keywords = ["mcp-server", "video-understanding", "video-analysis", "audio-analysis", "multimodal", "ai-agents", "llm", "mcp", "model-context-protocol", "video-quality", "apple-silicon"]
requires-python = ">=3.11"
license = { text = "MIT" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# The MCP transport is the point of the reel-mcp package, so it is a core dependency.
# The `mcp` extra stays so existing `pip install -e '.[mcp]'` commands keep working.
dependencies = ["numpy", "opencv-python-headless", "pillow", "librosa", "scipy", "soundfile", "matplotlib", "mcp>=1.20,<2"]

[project.urls]
Homepage = "https://github.com/Dradradre/Reel"
Repository = "https://github.com/Dradradre/Reel"
Documentation = "https://github.com/Dradradre/Reel/blob/main/docs/video-analysis-mcp.md"
Issues = "https://github.com/Dradradre/Reel/issues"

[project.optional-dependencies]
depth = ["torch", "torchvision", "transformers>=4.44,<4.46"]
mcp = ["mcp>=1.20,<2"]
separate = ["demucs", "torch", "torchaudio"]
crowd = ["audio-separator"]
mlx = ["mlx-whisper", "faster-whisper"]
speech = ["faster-whisper"]
voices = ["kaldi-native-fbank>=1.21,<2", "onnxruntime>=1.18,<2", "faster-whisper"]
events = ["ai-edge-litert==2.4.0"]
hearing = ["mlx-vlm==0.8.0"]
ocr = ["ocrmac"]
gaze = ["torch"]
tags = ["torch", "transformers>=4.40,<4.46"]
sync = ["torch", "torchvision", "torchaudio", "omegaconf", "einops", "timm", "transformers>=4.40,<4.46", "requests", "scikit-learn"]
all = ["kaldi-native-fbank>=1.21,<2", "onnxruntime>=1.18,<2", "ai-edge-litert==2.4.0", "demucs", "torch", "torchaudio", "audio-separator", "mlx-whisper", "faster-whisper", "ocrmac", "transformers>=4.44,<4.46", "torchvision", "omegaconf", "einops", "timm", "requests", "scikit-learn"]

[project.scripts]
reel = "reel.cli:main"
reel-mcp = "reel.cli:mcp_main"

[tool.setuptools]
packages = ["reel"]

[tool.setuptools.package-data]
reel = ["data/source_examples.csv"]
