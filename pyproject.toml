[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reel"
version = "0.1.0"
description = "Turn a film into pages a language model can watch front to back: picture, sound, speech, crowd and memory on one time axis."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy", "opencv-python-headless", "pillow", "librosa", "scipy", "soundfile", "matplotlib"]

[project.optional-dependencies]
mcp = ["mcp>=1.20,<2"]
separate = ["demucs", "torch", "torchaudio"]
crowd = ["audio-separator"]
mlx = ["mlx-whisper", "faster-whisper"]
speech = ["faster-whisper"]
voices = ["kaldi-native-fbank>=1.21,<2", "onnxruntime>=1.18,<2", "faster-whisper"]
events = ["ai-edge-litert==2.4.0"]
hearing = ["mlx-vlm==0.8.0"]
ocr = ["ocrmac"]
gaze = ["torch"]
tags = ["torch", "transformers>=4.40,<4.46"]
sync = ["torch", "torchvision", "torchaudio", "omegaconf", "einops", "timm", "transformers>=4.40,<4.46", "requests", "scikit-learn"]
all = ["kaldi-native-fbank>=1.21,<2", "onnxruntime>=1.18,<2", "ai-edge-litert==2.4.0", "demucs", "torch", "torchaudio", "audio-separator", "mlx-whisper", "faster-whisper", "ocrmac", "transformers>=4.40,<4.46", "torchvision", "omegaconf", "einops", "timm", "requests", "scikit-learn"]

[project.scripts]
reel = "reel.cli:main"

[tool.setuptools]
packages = ["reel"]

[tool.setuptools.package-data]
reel = ["data/source_examples.csv"]
